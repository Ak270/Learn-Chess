name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test            # unit, golden, property, integration (real Stockfish in Node)
      - run: npm run validate:content
      - run: npm run check:licenses
      - run: npm run build
      - run: npm run check:budget
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e         # flows, a11y (axe), offline, CSP
